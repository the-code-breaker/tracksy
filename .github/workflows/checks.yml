name: Tracksy checks
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run export -w @tracksy/mobile
      - run: npm run build -w @tracksy/admin
      - run: npm exec -- playwright install --with-deps chromium
      - run: npm exec -- playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-traces
          path: test-results
  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/billing-webhook/index.ts supabase/functions/push-worker/index.ts supabase/functions/recurring-worker/index.ts
