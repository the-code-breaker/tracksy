project_id = "tracksy"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "tracksy://auth/callback", "tracksy://auth/callback?recovery=true",
  "http://localhost:8081/auth/callback", "http://localhost:8081/auth/callback?recovery=true",
  "http://127.0.0.1:8081/auth/callback", "http://127.0.0.1:8081/auth/callback?recovery=true",
  "http://localhost:3001/auth/callback", "http://localhost:3001/auth/callback?recovery=true",
  "http://127.0.0.1:3001/auth/callback", "http://127.0.0.1:3001/auth/callback?recovery=true",
  "http://127.0.0.1:4317/auth/callback", "http://127.0.0.1:4317/auth/callback?recovery=true",
  "http://localhost:4317/auth/callback", "http://localhost:4317/auth/callback?recovery=true"
]
enable_signup = true
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
[functions.billing-webhook]
verify_jwt = false
[functions.push-worker]
verify_jwt = false
[functions.recurring-worker]
verify_jwt = false
[functions.group-mail]
# The handler verifies the user JWT with Auth before any authorized database RPC.
verify_jwt = false
